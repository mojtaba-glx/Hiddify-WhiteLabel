name: Publish v0.9.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 798640312e8ea5868dc385cdbea12408f46e3f7a
      - name: Verify version
        run: test "$(cat VERSION)" = "0.9.1"
      - name: Prepare release notes
        run: |
          awk '
            /^## v0\.9\.1/ {found=1; next}
            /^## / && found {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.1 >/dev/null 2>&1; then
            gh release edit v0.9.1 \
              --target 798640312e8ea5868dc385cdbea12408f46e3f7a \
              --title "Hiddify-WhiteLabel v0.9.1" \
              --notes-file release-notes.md
          else
            gh release create v0.9.1 \
              --target 798640312e8ea5868dc385cdbea12408f46e3f7a \
              --title "Hiddify-WhiteLabel v0.9.1" \
              --notes-file release-notes.md
          fi
