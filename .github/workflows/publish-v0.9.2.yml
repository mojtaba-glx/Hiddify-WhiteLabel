name: Publish v0.9.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4538ae5e3c2e6475b6dc5704e50424ea4367807d
      - name: Verify version
        run: test "$(cat VERSION)" = "0.9.2"
      - name: Prepare release notes
        run: |
          awk '
            /^## v0\.9\.2/ {found=1; next}
            /^## / && found {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.2 >/dev/null 2>&1; then
            gh release edit v0.9.2 \
              --target 4538ae5e3c2e6475b6dc5704e50424ea4367807d \
              --title "Hiddify-WhiteLabel v0.9.2" \
              --notes-file release-notes.md
          else
            gh release create v0.9.2 \
              --target 4538ae5e3c2e6475b6dc5704e50424ea4367807d \
              --title "Hiddify-WhiteLabel v0.9.2" \
              --notes-file release-notes.md
          fi
